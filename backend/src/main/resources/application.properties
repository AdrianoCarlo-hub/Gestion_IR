# =====================================================
# Safidy - Configuration Spring Boot
# =====================================================

spring.application.name=safidy

# -----------------------------------------------------
# Serveur
# -----------------------------------------------------
server.port=8080

# -----------------------------------------------------
# Base de donnees PostgreSQL
# -----------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/safidy
spring.datasource.username=postgres
spring.datasource.password=Lovanirina#3
spring.datasource.driver-class-name=org.postgresql.Driver

# -----------------------------------------------------
# JPA / Hibernate
# -----------------------------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# -----------------------------------------------------
# Jackson (dates au format jj/MM/aaaa)
# -----------------------------------------------------
spring.jackson.date-format=dd/MM/yyyy
spring.jackson.time-zone=Indian/Antananarivo

# -----------------------------------------------------
# Logs
# -----------------------------------------------------
logging.level.mg.safidy=DEBUG
logging.level.org.springframework.security=INFO
